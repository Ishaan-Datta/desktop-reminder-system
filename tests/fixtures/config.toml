# Test Configuration
# This config is used for testing without modifying ~/.config/reminder-system/

# General settings (optional - these are the defaults)
[general]
text_font = "Sans Serif"              # Font family for reminder text
text_size = 24                        # Font size in pixels for reminder text
icon_scale = 1.0                      # Scale factor for icons (1.0 = 200px base size)
max_opacity = 0.85                    # Maximum opacity of dark overlay (0.0-1.0)
fade_in_duration = 2000               # Fade-in animation duration in milliseconds
fade_out_duration = 500               # Fade-out animation duration in milliseconds
lock_dir = "/tmp/test-reminder-locks" # Directory scanned for lock files
stagger_interval = 2                  # Seconds to wait between showing queued reminders
resume_interval = 1                   # Seconds to wait before showing the first queued reminder
work_session_enable = true            # Work session feature off for tests by default
work_session_start = "09:00"          # Work session start time (HH:MM, 24-hour)
work_session_end = "17:00"            # Work session end time (HH:MM, 24-hour)

[test_reminder]
text = "Something something fr fr"
schedule = ["* * * * *"]
icon = "test_icon.png"
snooze_duration = 10
